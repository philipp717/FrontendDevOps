apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-devops
  namespace: devops
  labels:
    app: frontend-devops
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend-devops
  template:
    metadata:
      labels:
        app: frontend-devops
    spec:
      containers:
        - name: frontend-devops
          image: ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/frontend-devops:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
